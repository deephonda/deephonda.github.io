<style>
:root{
  --red:#cc0000; --red-dark:#990000; --red-soft:#fdecec;
  --bg:#f5f5f4; --card:#ffffff; --ink:#1c1c1c; --muted:#6b6b6b; --line:#e3e3e1;
  --green:#137333; --green-soft:#e6f4ea; --amber:#a15c00; --amber-soft:#fff4e0;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--red);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.3px}
header .sub{font-size:12px;opacity:.85}
header .grow{flex:1}
nav{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 8px;position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:12px 14px;font:inherit;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--red);border-bottom-color:var(--red)}
main{max-width:1440px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.stat.red .v{color:var(--red)}
form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 12px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px;font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);padding:8px 10px;border:1px solid #cfcfcc;border-radius:7px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:var(--red)}
textarea{min-height:60px;resize:vertical}
.span2{grid-column:span 2}
@media (max-width:520px){.span2{grid-column:span 1}}
.btn{border:1px solid var(--red);background:var(--red);color:#fff;padding:8px 14px;border-radius:7px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--red-dark)}
.btn.ghost{background:#fff;color:var(--red)}
.btn.ghost:hover{background:var(--red-soft)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.plain{border-color:#cfcfcc;background:#fff;color:var(--ink)}
label.btn{display:inline-flex;flex-direction:row;align-items:center;width:auto}
.imp td,.imp th{font-size:13px;padding:5px 8px}
details{margin-top:8px;font-size:13px}
details ul{max-height:160px;overflow:auto;margin:6px 0;padding-left:18px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;background:#fff;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#fafaf9;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:#fcfcfb}
table.nice th{background:#fbf3f3;color:#7a2a2a;font-size:11px;padding:10px 9px;border-bottom:2px solid #f0dcdc}
table.nice td{padding:11px 9px;vertical-align:top}
table.nice tbody tr:nth-child(even) td{background:#fcfcfb}
table.nice tbody tr:hover td{background:#fff3e6}
tr.click{cursor:pointer}
table.nice td.wrap{white-space:normal;min-width:130px;max-width:210px}
table.nice tfoot td{border-top:2px solid #e3e3e1;padding:12px}
.sub2{font-size:12px;color:var(--muted);margin-top:2px;font-weight:400}
.amt{font-weight:700;font-variant-numeric:tabular-nums}.amt.neg{color:#c00}.amt.pos{color:var(--green)}.amt.ok{color:var(--green)}
a.fill{color:var(--amber);font-weight:600;text-decoration:none;border-bottom:1px dashed}
.stat .sub2{margin-top:4px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.pill.in{background:var(--green-soft);color:var(--green)}
.pill.sold{background:#eee;color:#555}
.pill.due{background:var(--amber-soft);color:var(--amber)}
.pill.open{background:#e8f0fe;color:#1a56c4}
.pill.lost{background:#eee;color:#777}
.muted{color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.hide{display:none!important}
.tot td{font-weight:700;background:#fafaf9}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
.warn{background:var(--amber-soft);color:var(--amber);padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:12px}
dialog{border:0;border-radius:12px;padding:0;max-width:640px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog .dh{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex}
dialog .db{padding:16px}
dialog .df{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
#toast.show{opacity:1}
#syncbar{position:fixed;bottom:16px;right:16px;background:#1a56c4;color:#fff;padding:8px 10px 8px 14px;border-radius:10px;z-index:40;display:flex;gap:10px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#syncbar .btn{background:#fff;color:#1a56c4;border-color:#fff}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block;padding:10mm;font-size:13px}
  #print table{font-size:13px}
  #print th,#print td{border:1px solid #999;white-space:normal}
}
@media (pointer:coarse){input,select,textarea{font-size:16px}nav button{padding:14px 16px}}
html{-webkit-text-size-adjust:100%}
.rc h3{margin:0;color:var(--red);font-size:22px}
.rc .hd{border-bottom:2px solid var(--red);padding-bottom:8px;margin-bottom:12px;display:flex;justify-content:space-between;gap:12px}
.rc .sign{display:flex;justify-content:space-between;margin-top:60px}
a.btn{text-decoration:none}
</style>
</head>

function fmtInput(t){
  const old=t.value, pos=t.selectionStart??old.length, digitsBefore=old.slice(0,pos).replace(/[^\d.]/g,'').length;
  const nv=inFmt(old); if(nv===old) return; t.value=nv;
  let c=0,i=0; while(i<nv.length&&c<digitsBefore){ if(/[\d.]/.test(nv[i])) c++; i++ }
  try{t.setSelectionRange(i,i)}catch(e){}
}
document.addEventListener('input',e=>{const t=e.target; if(t&&t.matches&&t.matches('input[inputmode=decimal]')) fmtInput(t)},true);
const fmtAll=()=>document.querySelectorAll('input[inputmode=decimal]').forEach(i=>{if(i.value&&document.activeElement!==i){const v=inFmt(i.value);if(v!==i.value)i.value=v}});
new MutationObserver(fmtAll).observe(document.documentElement,{childList:true,subtree:true});

function stDeleteAll(){

function stDelete(){

  const sold=sel.filter(s=>s.status==='sold'&&s.saleId&&DB.sales.some(z=>z.id===s.saleId)), del=sel.filter(s=>!sold.includes(s));

function addStock(e){
  e.preventDefault(); const f=e.target, d=formData(f);
  d.chassis=up(d.chassis); d.engine=up(d.engine); d.key=up(d.key); if(d.cost) d.cost=String(num(d.cost));
  const dup=DB.stock.find(s=>s.chassis===d.chassis||s.engine===d.engine);
  if(dup && !confirm(`A vehicle with this ${dup.chassis===d.chassis?'chassis':'engine'} number already exists (${dup.model}). Save anyway?`)) return;
  DB.stock.push({id:uid(),created:Date.now(),status:'in',...d});
  if(d.model && !DB.settings.models.includes(d.model)) DB.settings.models.push(d.model);
  if(d.colour && !DB.settings.colours.includes(d.colour)) DB.settings.colours.push(d.colour);
  save(); toast('Vehicle added to stock');
  const keep={challan:d.challan,model:d.model,colour:d.colour,date:d.date};
  vStock(); const nf=$('#fStock'); for(const k in keep) nf[k].value=keep[k]; nf.engine.focus();
}
function dupPlan(){
  const key=s=>up(s.chassis)||(up(s.engine)?'E:'+up(s.engine):''), groups={};
  DB.stock.forEach(s=>{const k=key(s); if(k)(groups[k]=groups[k]||[]).push(s)});
  // also join rows that share an engine no but differ / miss chassis
  const byEng={}; DB.stock.forEach(s=>{const e=up(s.engine); if(e)(byEng[e]=byEng[e]||[]).push(s)});
  const seen=new Set(), sets=[];
  for(const g of [...Object.values(groups),...Object.values(byEng)]){ if(g.length<2) continue;
    const ids=g.map(x=>x.id).sort().join(); if(seen.has(ids)) continue; seen.add(ids); sets.push(g) }
  const remove=[], keep=[], stuck=[], gone=new Set();
  const good=c=>c&&!/[,;&]/.test(c);
  for(const g0 of sets){ const g=g0.filter(x=>!gone.has(x.id)); if(g.length<2) continue;
    const used=x=>x.status==='sold'&&x.saleId&&DB.sales.some(z=>z.id===x.saleId);
    const rank=x=>(used(x)?0:10)+(good(x.challan)?0:2)+(x.status==='sold'?0:1);
    g.sort((a,b)=>rank(a)-rank(b)||(a.created||0)-(b.created||0));
    const k=g[0]; keep.push(k);
    g.slice(1).forEach(x=>{ if(used(x)) stuck.push(x); else {remove.push({x,k}); gone.add(x.id)} });
  }
  return {remove,keep,stuck};
}
function dupReview(){
  const P=dupPlan();
  if(!P.remove.length){toast('No duplicate vehicles found');return}

function saveEditSale(id){

  if(!schOk(d.schallan,id)) return;
  Object.assign(s,{schallan:d.schallan,date:d.date||s.date,name:d.name,rel:d.rel,relName:d.relName,phone:d.phone,address:d.address,model:d.model,colour:d.colour,chassis:ch,engine:en,key:up(d.key),

  if(st) Object.assign(st,{challan:d.pchallan,model:d.model,colour:d.colour,chassis:ch,engine:en,key:up(d.key)});

    Object.assign(p,{date:g('pdate').value||p.date,amount:num(g('pamt').value),mode:g('pmode').value,ref:txt(g('pref').value)});
    if(g('pby')){ if(g('pby').value) p.by=g('pby').value; else delete p.by }

  const fe=DB.daybook.find(x=>x.fin&&x.saleId===id); if(fe) fe.particulars=`Finance ${s.financer||''} – Sale #${s.inv} ${s.name}`;

function dayBalance(before){
  let cash=0,total=0;
  for(const d of DB.daybook){ if((before&&d.date>=before)||!inCash(d)) continue; const v=(d.type==='in'?1:-1)*num(d.amount); total+=v; if(d.mode==='Cash') cash+=v; }

}

/* One-time move: entries kept in the old Dealer / Rent & Salary / Expenses / Partners tabs become Day Book entries.
   The old lists are left untouched (and no longer used) as a safety copy. */
function migrateDB(){
  if(DB.settings.dbOnly) return false;
  const DP=DB.dealerPay||[], EP=DB.expPay||[], EX=DB.expenses||[], CP=DB.capital||[];
  const inDay=new Set(); DB.daybook.forEach(d=>['dpId','epId','exId','capId'].forEach(k=>{if(d[k]) inDay.add(k+':'+d[k])}));
  const linked=new Set([...DP,...EP,...EX].map(x=>x.capId).filter(Boolean)), manCap=new Set(DB.daybook.filter(d=>d.man&&d.capId).map(d=>d.capId));
  const keep=[], add=[], clean=o=>{for(const k in o) if(o[k]===undefined||o[k]==='') delete o[k]; return o};
  for(const d of DB.daybook){
    if(d.man){ if(d.head){const r={...d}; r.particulars=d.rem??d.particulars; delete r.man; delete r.capId; delete r.rem; add.push(r)} continue }
    if(d.dpId||d.epId||d.exId||d.capId) continue;
    keep.push(d);
  }
  const mk=(x,key,o)=>clean({id:uid(),created:x.created||Date.now(),date:x.date||today(),amount:num(x.amount),mode:x.mode||'Cash',...o,old:inDay.has(key)?undefined:1});
  DP.forEach(x=>add.push(mk(x,'dpId:'+x.id,{type:'out',head:H.dealer,by:x.by,ref:x.ref,challans:x.challans,particulars:x.note||''})));
  EP.forEach(x=>add.push(mk(x,'epId:'+x.id,{type:'out',head:isOwner(x.payee)?H.rent:H.sal,payee:x.payee,forMonth:x.forMonth,ptype:isOwner(x.payee)?undefined:x.type,by:x.by,ref:x.ref,particulars:x.note||''})));
  const CAT={'Spare parts':H.spare,'Workshop':H.work,'Miscellaneous':H.misc};
  EX.forEach(x=>add.push(mk(x,'exId:'+x.id,{type:'out',head:CAT[x.cat]||H.show,by:x.by,vendor:x.vendor,bill:x.bill,particulars:(CAT[x.cat]?'':x.cat+': ')+(x.usedFor||'')+(x.note?' · '+x.note:'')})));
  CP.filter(c=>!linked.has(c.id)&&!manCap.has(c.id)).forEach(c=>add.push(mk(c,'capId:'+c.id,
    c.type==='in'?{type:'in',head:H.capIn,pid:c.partnerId,particulars:c.note||''}:c.type==='out'?{type:'out',head:H.capOut,pid:c.partnerId,particulars:c.note||''}:{type:'out',head:H.show,by:c.partnerId,particulars:c.note||'Expense'})));
  add.forEach(r=>{ if(r.by) delete r.old });   // paid / kept by a partner never touches business cash anyway
  DB.daybook=[...keep,...add]; DB.settings.dbOnly=1; DB.settings.migratedAt=new Date().toISOString();
  return true;
}

/* ---------- double-entry check ---------- */
const dupKey=d=>[d.date,d.type,Math.round(num(d.amount)),headOf(d)].join('|');
// Day Book entries already in the book that look the same as r (same date, in/out, amount and head)
const daySame=(r,skipId)=>DB.daybook.filter(x=>x.id!==skipId&&!x.dupOk&&dupKey(x)===dupKey(r));
function dupConfirm(list,what){
  if(!list.length) return true;
  return confirm(`⚠ Possible DOUBLE ENTRY\n\n${what} already exists:\n`+list.slice(0,3).map(x=>`• ${fd(x.date)} · ${headOf(x)||''} · ${rs(x.amount)} · ${x.particulars||''}`).join('\n')+`\n\nSave it again anyway?`);
}
function dupScan(){
  const G=[], byK={};
  DB.daybook.filter(d=>!d.dupOk&&num(d.amount)>0).forEach(d=>(byK[dupKey(d)]=byK[dupKey(d)]||[]).push(d));
  for(const k in byK) if(byK[k].length>1) G.push({kind:'day',items:byK[k]});
  const grp=(f,label)=>{const m={}; DB.sales.forEach(s=>{const v=txt(f(s)).toUpperCase(); if(v&&!s.dupOk) (m[v]=m[v]||[]).push(s)}); for(const v in m) if(m[v].length>1) G.push({kind:'sale',label:label+' '+v,items:m[v]})};
  grp(s=>s.chassis,'Same chassis'); grp(s=>s.engine,'Same engine no'); grp(s=>s.schallan,'Same sale challan');
  const seen=new Set(G.filter(g=>g.kind==='sale').map(g=>g.items.map(x=>x.id).sort().join()));
  for(let i=G.length-1;i>=0;i--){const g=G[i]; if(g.kind!=='sale'||!g.label.startsWith('Same engine')) continue; const k=g.items.map(x=>x.id).sort().join(); if(G.some((h,j)=>j!==i&&h.kind==='sale'&&!h.label.startsWith('Same engine')&&h.items.map(x=>x.id).sort().join()===k)) G.splice(i,1)}
  const grpL=(list,f,kind,label)=>{const m={}; list.filter(x=>!x.dupOk).forEach(x=>{const v=txt(f(x)).toUpperCase(); if(v)(m[v]=m[v]||[]).push(x)}); for(const v in m) if(m[v].length>1) G.push({kind,label:label+' '+v,items:m[v]})};
  const stk=DB.stock.filter(s=>s.status!=='returned');
  grpL(stk,s=>s.chassis,'stock','Same chassis in stock');

const ovRecd=o=>DB.daybook.filter(d=>d.oldId===o.id&&d.type==='in').reduce((a,d)=>a+num(d.amount),0);
const ovDue=o=>o.status==='sold'?Math.max(0,num(o.soldPrice)-ovRecd(o)):0;
// Every sale with an exchange value has an old-vehicle record; keep it in step with the sale.
function oldSync(){
  let ch=false; DB.oldveh=DB.oldveh||[];
  for(const s of DB.sales){ if(!(num(s.exchangeValue)>0)) continue;
    let o=DB.oldveh.find(x=>x.srcSaleId===s.id);
    if(!o){ o={id:uid(),created:Date.now(),srcSaleId:s.id,status:'in',model:s.exchange||'',regNo:''}; DB.oldveh.push(o); ch=true }
    const want={date:s.date,cost:num(s.exchangeValue),fromName:s.name,fromPhone:s.phone,fromAddr:s.address};
    for(const k in want) if(o[k]!==want[k]){o[k]=want[k];ch=true}
    if(!o.model&&s.exchange){o.model=s.exchange;ch=true}
    if(s.exchangeReg&&o.regNo!==s.exchangeReg){o.regNo=s.exchangeReg;ch=true}
  }
  const gone=DB.oldveh.filter(o=>o.srcSaleId&&o.status!=='sold'&&!DB.sales.some(s=>s.id===o.srcSaleId&&num(s.exchangeValue)>0));
  if(gone.length){DB.oldveh=DB.oldveh.filter(o=>!gone.includes(o));ch=true}
  return ch;
}

const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function download(name,text,type){
  if(IOS&&navigator.canShare){try{const fl=new File([text],name,{type});if(navigator.canShare({files:[fl]})){navigator.share({files:[fl]}).catch(e=>{if(e&&e.name!=='AbortError')dlAnchor(name,text,type)});return}}catch(e){}}
  dlAnchor(name,text,type)}
function dlAnchor(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function backupJSON(){DB.settings.lastBackup=new Date().toISOString();save();download(`deep-honda-backup-${today()}.json`,JSON.stringify(DB,null,1),'application/json');toast('Backup downloaded');if(tab==='dash'||tab==='set')render()}
function restoreJSON(file){
  if(!file) return; const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result); if(!d.settings||!Array.isArray(d.stock)) throw 0;
    if(!confirm((CLOUD?'⚠ CLOUD: data on ALL devices will be replaced by this backup!\n\n':'')+`Replace ALL current data with this backup?\n(${d.stock.length} vehicles, ${d.sales.length} sales, ${d.daybook.length} day book entries)`)) return;
    DB=d; for(const k in DEFAULTS) if(!(k in DB)) DB[k]=structuredClone(DEFAULTS[k]); save(); render(); toast('Backup restored');
  }catch(e){alert('This is not a valid backup file.')}};
  r.readAsText(file);
}

    stock:[['date','challan','saleChallan','model','colour','engine','chassis','key','cost','status'],()=>DB.stock.map(r=>({...r,saleChallan:(DB.sales.find(z=>z.id===r.saleId)||{}).schallan||''}))],

    daybook:[['date','type','head','particulars','amount','mode','paidBy','partner','paidTo','paymentType','forMonth','vendor','bill','ref','challans','notInCash'],
      ()=>dayRows().map(r=>({...r,head:headOf(r),type:r.type==='in'?'Receipt':'Payment',paidBy:r.saleId?'':PB(r),partner:r.pid?pName(r.pid):'',paidTo:r.payee?epName(r.payee):'',paymentType:r.ptype||'',forMonth:mLabel(r.forMonth),notInCash:r.by||r.old?'Yes':''}))],
    enquiries:[['date','name','phone','model','exchange','followUp','status','notes'],()=>DB.enquiries],
    dealer:[['date','amount','mode','paidBy','ref','challans','particulars'],()=>oldest(dpRows()).map(r=>({...r,paidBy:PB(r)}))],
    rent:[['date','paidTo','type','forMonth','amount','mode','paidBy','ref','particulars'],()=>oldest(epRows()).map(r=>({...r,paidTo:epName(r.payee),type:r.head===H.rent?'Rent':r.ptype||'Salary',forMonth:mLabel(r.forMonth),paidBy:PB(r)}))],
    exp:[['date','head','particulars','amount','vendor','bill','mode','paidBy'],()=>oldest(exRows()).map(r=>({...r,paidBy:PB(r)}))],
    oldveh:[['regNo','model','year','colour','chassis','engine','fromName','fromPhone','date','cost','repair','status','soldDate','buyer','buyerPhone','soldPrice','received','due','profit','note'],()=>(DB.oldveh||[]).map(o=>({...o,received:ovRecd(o),due:ovDue(o),profit:o.status==='sold'?ovProfit(o):''}))],
    dues:[['name','relName','phone','address','model','colour','schallan','date','days','total','finance','exchangeValue','received','discount','due','lastPayment','promiseDate','promiseNote'],()=>duesRows().map(s=>({...s,days:daysAgo(s.date),received:saleReceived(s),due:Math.round(saleDue(s)),lastPayment:lastPay(s),promiseDate:s.dueFollow?.date||'',promiseNote:s.dueFollow?.note||''}))],
    ledger:[['date','head','remarks','mode','debit','credit','balance'],()=>{const D=ledData(ledOf(ledK),ledFrom,ledTo);return [{date:ledFrom,head:'Opening balance',balance:drcr(D.ob)},...D.rows.map(r=>({date:r.d.date,head:headOf(r.d),remarks:ledText(r.d),mode:r.d.mode,debit:r.dr||'',credit:r.cr||'',balance:drcr(r.bal)}))]}],
    cashbook:[['date','head','remarks','mode','receipt','payment','balance'],()=>{const D=ledData(ledOf(cbK),ledFrom,ledTo);return [{date:ledFrom,head:'Opening balance',balance:D.ob},...D.rows.map(r=>({date:r.d.date,head:headOf(r.d),remarks:ledText(r.d),mode:r.d.mode,receipt:r.dr||'',payment:r.cr||'',balance:r.bal}))]}],
    capital:[['date','partner','entry','particulars','mode','investedOrPaid','withdrawnOrKept'],()=>oldest(capAll().filter(d=>!capF||capP(d)===capF)).map(d=>({...d,partner:pName(capP(d)),entry:capLabel(d),investedOrPaid:capSign(d)>0?d.amount:'',withdrawnOrKept:capSign(d)<0?d.amount:''}))]
  }[which];
  const cols=R[0], rows=R[1]();

  // Leading tab keeps long chassis/engine numbers from turning into scientific notation in Excel
  const t=v=>/^\d{11,}$/.test(String(v))?'\t'+v:v;
  download(`${which}-${today()}.csv`,'﻿'+[cols.join(','),...rows.map(r=>cols.map(c=>q(t(r[c]))).join(','))].join('\n'),'text/csv');
}

// dealer
const dpAll=()=>DB.daybook.filter(d=>d.head===H.dealer||d.fin);
const dpRows=()=>dpAll().filter(x=>!dpF||(dpF==='fin'?x.fin:dpF==='biz'?!x.by&&!x.fin:x.by===dpF));
function dealerAcct(){
  const live=DB.stock.filter(s=>s.status!=='returned');
  const purchase=live.reduce((a,s)=>a+num(s.cost),0), noCost=live.filter(s=>!num(s.cost)).length;
  const sg=x=>x.fin||x.type!=='in'?num(x.amount):-num(x.amount);
  const paid=dpAll().reduce((a,x)=>a+sg(x),0);
  const by={}; dpAll().forEach(x=>{const k=x.fin?'fin':x.by||'biz'; by[k]=(by[k]||0)+sg(x)});
  return {purchase,noCost,paid,by};
}
// rent & salary
const epAll=()=>DB.daybook.filter(d=>(d.head===H.rent||d.head===H.sal)&&d.payee);
const epRows=()=>epAll().filter(x=>!epF||x.payee===epF);
function monthsBack(n){const out=[];let d=new Date(curMonth()+'-01');for(let i=0;i<n;i++){out.push(d.toISOString().slice(0,7));d.setMonth(d.getMonth()-1)}return out}
function payeeMonths(pid,due){
  const P=epAll().filter(x=>x.payee===pid), first=P.reduce((m,x)=>x.forMonth&&x.forMonth<m?x.forMonth:m,curMonth());
  let n=Math.min(24,Math.max(1,(+curMonth().slice(0,4)-+first.slice(0,4))*12+(+curMonth().slice(5,7)-+first.slice(5,7))+1));
  return monthsBack(n).map(m=>{const L=P.filter(x=>x.forMonth===m), paid=L.reduce((a,x)=>a+num(x.amount),0);
    return {m,due,paid,adv:L.filter(x=>x.ptype==='Advance').reduce((a,x)=>a+num(x.amount),0),bonus:L.filter(x=>x.ptype==='Bonus').reduce((a,x)=>a+num(x.amount),0),
      dates:L.map(x=>fd(x.date)).join(', ')}});
}
function monthTable(rows,label){
  const st=r=>!r.due?(r.paid?'<span class="pill in">Paid</span>':'<span class="muted">—</span>'):r.paid>=r.due-0.5?(r.paid>r.due+0.5?`<span class="pill open">+${rs(r.paid-r.due)} extra</span>`:'<span class="pill in">Paid</span>'):r.paid>0?`<span class="pill due">${rs(r.due-r.paid)} pending</span>`:`<span class="pill due">${rs(r.due)} pending</span>`;
  return `<div class="tablewrap"><table class="nice"><thead><tr><th>Month</th><th class="num">${label}</th><th class="num">Paid</th><th>Paid on</th><th>Status</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td><b>${mLabel(r.m)}</b></td><td class="num">${r.due?rs(r.due):'—'}</td><td class="num">${r.paid?rs(r.paid):'—'}${r.adv?`<div class="sub2">incl. advance ${rs(r.adv)}</div>`:''}${r.bonus?`<div class="sub2">incl. bonus ${rs(r.bonus)}</div>`:''}</td><td class="wrap">${r.dates||'<span class="muted">—</span>'}</td><td>${st(r)}</td></tr>`).join('')}</tbody></table></div>`;
}
// expenses
const exAll=()=>DB.daybook.filter(d=>d.type==='out'&&EXP_HEADS.includes(d.head));
const exRows=()=>exAll().filter(x=>(!exF||x.head===exF)&&(!exM||(x.date||'').startsWith(exM)));
// partners: capital comes from "Partner capital / withdrawal" heads and from anything a partner paid or kept personally
const capAll=()=>DB.daybook.filter(d=>d.pid||d.by);
const capP=d=>d.pid||d.by;
const capSign=d=>d.head===H.capIn||d.head===H.hand?1:d.head===H.capOut?-1:d.by?(d.type==='out'?1:-1):0;
const capLabel=d=>d.head===H.hand?'Handed over money to business':d.saleId&&d.by?(d.fin?'Received finance money':'Received sale money'):d.head===H.capIn?'Money invested':d.head===H.capOut?'Money withdrawn':d.type==='out'?'Paid from own pocket – '+d.head:'Kept money received – '+d.head;
function partnerSummary(){
  const P=DB.partners.map(p=>{const c=capAll().filter(x=>capP(x)===p.id);
    const put=c.filter(x=>capSign(x)>0).reduce((a,x)=>a+num(x.amount),0), took=c.filter(x=>capSign(x)<0).reduce((a,x)=>a+num(x.amount),0);
    return {...p,share:num(p.share),put,took,net:put-took}});
  const totShare=P.reduce((a,p)=>a+p.share,0), agreed=num(DB.settings.agreedCapital);
  // With an agreed total, each partner owes their share of it. Without one, the partner who is furthest
  // ahead (relative to their share) sets the level the others should match.
  const base=agreed>0?agreed:Math.max(0,...P.map(p=>p.share>0?p.net/(p.share/(totShare||1)):0));
  P.forEach(p=>{p.should=totShare?base*p.share/totShare:0; p.pending=p.should-p.net});
  return {P,totShare,agreed,total:P.reduce((a,p)=>a+p.net,0)};
}

function saleMatch(ch,en,pool){
  const t=x=>x&&x.length>=5?x.slice(-5):'';
  let st=pool.find(s=>(ch&&s.chassis===ch)||(en&&s.engine===en));
  if(!st){const c=pool.filter(s=>(t(ch)&&t(s.chassis)===t(ch))||(t(en)&&t(s.engine)===t(en))); if(c.length===1) st=c[0]}
  return st||null;
}

    <td>${inp('name',txt(d.customer_name),130)}</td><td>${inp('relName',txt(d.relative_name),110,'placeholder="Father/Husband"')}</td><td>${inp('phone',txt(d.phone),100)}</td>

  <div class="tablewrap imp"><table id="slT"><tr><th></th><th>Sale Challan</th><th>Purchase Challan</th><th>Date</th><th>Customer</th><th>S/o</th><th>Mobile</th><th>Model</th><th>Chassis</th><th>Engine</th><th>Price</th><th>Finance</th><th>Financer</th><th>Paid</th><th>Mode</th><th></th></tr>${rows}</table></div>

function saveSales(){
  const L=window.__sales||[], out=[], bad=[], skipped=[];
  const used=new Set();
  [...document.querySelectorAll('#slT tr')].slice(1).forEach((tr,n)=>{
    if(!tr.querySelector('input[type=checkbox]').checked) return;
    const g=k=>{const e=tr.querySelector(`[name=${k}]`);return e?txt(e.value):''}, d=L[+tr.dataset.i]||{};
    const r={schallan:g('schallan'),pchallan:g('pchallan'),key:up(d.key_no),date:g('date')||today(),name:g('name'),relName:g('relName'),phone:g('phone'),model:g('model'),chassis:up(g('chassis')),engine:up(g('engine')),
      price:num(g('price')),finance:num(g('finance')),financer:g('financer'),paid:num(g('paid')),mode:g('mode')||'Cash',
      rel:d.relation||'S/o',address:txt(d.address),extra:num(d.accessories),exchange:txt(d.exchange_vehicle),exchangeValue:num(d.exchange_value),ref:txt(d.payment_ref),notes:txt(d.notes),colour:txt(d.colour)};
    if(!r.name||!(r.chassis||r.engine)){bad.push(n+1);return}
    out.push(r);
  });

  if(!out.length){alert('No sale selected.');return}
  const dupS=[], seenS=new Set();
  for(const r of out){ const v=txt(r.schallan).toUpperCase(); if(v&&(schSame(v)||seenS.has(v))) dupS.push(r.schallan); if(v) seenS.add(v) }
  if(dupS.length&&!confirm(`⚠ Possible DOUBLE ENTRY\n\nSale challan ${dupS.join(', ')} is already used (or appears twice here).\n\nSave anyway?`)) return;
  let made=0;
  for(const r of out){
    if(DB.sales.some(x=>(r.chassis&&x.chassis===r.chassis)||(r.engine&&x.engine===r.engine))){skipped.push(r.chassis||r.engine);continue}
    const avail=DB.stock.filter(s=>isIn(s)&&!used.has(s.id));
    let st=saleMatch(r.chassis,r.engine,avail);
    if(!st&&DB.stock.some(s=>s.status==='sold'&&((r.chassis&&s.chassis===r.chassis)||(r.engine&&s.engine===r.engine)))){skipped.push(r.chassis||r.engine);continue}
    if(st){if(!st.challan&&r.pchallan)st.challan=r.pchallan; if(!st.key&&r.key)st.key=r.key}
    if(!st){st={id:uid(),created:Date.now(),status:'in',date:r.date,challan:r.pchallan,model:r.model,colour:r.colour,engine:r.engine,chassis:r.chassis,key:r.key,cost:''};DB.stock.push(st);
      if(r.model&&!DB.settings.models.includes(r.model))DB.settings.models.push(r.model)}
    used.add(st.id);
    const id=uid(), inv=Math.max(num(DB.settings.nextInv)||1,1+Math.max(0,...DB.sales.map(x=>num(x.inv)))); DB.settings.nextInv=inv+1;
    const sale={id,inv,schallan:r.schallan,created:Date.now()+made,date:r.date,stockId:st.id,model:st.model||r.model,colour:st.colour||r.colour,chassis:st.chassis||r.chassis,engine:st.engine||r.engine,key:st.key,
      name:r.name,rel:r.rel,relName:r.relName,phone:r.phone,address:r.address,price:r.price,extra:r.extra,total:r.price+r.extra,
      finance:r.finance,financer:r.financer,financeReceived:false,exchange:r.exchange,exchangeValue:r.exchangeValue,notes:r.notes,payments:[]};
    DB.sales.push(sale); st.status='sold'; st.saleId=id;
    if(r.paid>0) addPayment(sale,{date:r.date,amount:r.paid,mode:r.mode,ref:r.ref});
    made++;
  }
  save(); dlg.close(); toast(`${made} sales added`+(skipped.length?` · ${skipped.length} already sold, skipped`:'')); go('sales');
}

async function aiPay(files){

- amount: the final total (including tax), number only.

function parseCSV(text){

    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else if(c==='"') q=true;
    else if(c===sep){row.push(f);f=''}

const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function toISO(v){

  if(m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)) return p(m[1],m[2],m[3]);
  if(m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/)) return p(m[3],m[2],m[1]);

function readRecords(rows,fields){

    (rows[r]||[]).forEach((h,i)=>{const n=norm(h); if(!n) return; for(const f in fields) if(!(f in idx)&&fields[f].includes(n)){idx[f]=i;break}});
    if(Object.keys(idx).length>=2){
      const recs=[];
      for(let i=r+1;i<rows.length;i++){const row=rows[i]||[]; if(!row.some(c=>txt(c))) continue;

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){return ''}}
const aiProv=()=>ls(AIP)||'openai';

const CH_SCHEMA={type:'object',additionalProperties:false,required:['challan_no','date','supplier','vehicles'],properties:{
  challan_no:{type:'string'},date:{type:'string',description:'YYYY-MM-DD, or empty'},supplier:{type:'string'},
  vehicles:{type:'array',items:{type:'object',additionalProperties:false,required:['challan_no','date','model','colour','engine','chassis','key','price'],properties:{
    challan_no:{type:'string'},date:{type:'string',description:'YYYY-MM-DD, or empty'},model:{type:'string'},colour:{type:'string'},engine:{type:'string'},chassis:{type:'string'},key:{type:'string'},price:{type:'number',description:'0 if not shown'}}}}}};
function shrinkImage(file){return new Promise((ok,no)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,2000/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
    c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',0.88).split(',')[1])};
  img.onerror=()=>{URL.revokeObjectURL(u);no(new Error('IMG'))};img.src=u})}
const fileB64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)});
async function aiChallan(files){
  if(!files.length) return;
  const key=getKey();
  if(!key){openDlg('API key needed',`<p style="margin-top:0">To read challan photos, first enter the ${aiProv()==='openai'?'OpenAI (ChatGPT)':'Anthropic (Claude)'} API key in <b>Settings & Backup</b> (one time).</p>`,`<button class="btn plain" onclick="dlg.close()">Cancel</button><button class="btn" onclick="dlg.close();go('set')">Open Settings</button>`);return}
  openDlg('Reading challan…','<div class="empty">⏳ Reading photos — this can take 20 to 60 seconds. Please keep this window open.</div>','');
  try{
    const parts=[];
    for(const f of files){
      if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)) parts.push({pdf:true,name:f.name,b64:await fileB64(f)});
      else parts.push({pdf:false,b64:await shrinkImage(f)});
    }
    const prompt=`These are page(s) of a vehicle delivery challan / purchase invoice received by an Indian two-wheeler dealership (Honda) from its supplier.
Extract every vehicle listed. For each vehicle give model, colour, engine number, chassis (frame / VIN) number, key number and price.
- Copy engine and chassis numbers exactly, character by character, in capitals with no spaces. Read them carefully: they are the most important fields. Do not confuse 0/O, 1/I, 5/S, 8/B.
- If the printed model or colour matches one of these names used by the dealership, use that exact name; otherwise copy what is printed.
  Models: ${DB.settings.models.join(', ')}
  Colours: ${DB.settings.colours.join(', ')}
- price: the per-vehicle amount including taxes if shown, else the per-vehicle amount shown, else 0.
- date: the challan / invoice date as YYYY-MM-DD (Indian dates are day-month-year). challan_no: the challan / invoice / delivery note number. supplier: the issuer's name.
- The pages may belong to SEVERAL different challans. For EVERY vehicle also fill its own challan_no and date, taken from the challan page it is listed on (the header of that page, or of the earlier page of the same challan). Top-level challan_no and date: those of the first challan.
- challan_no is always ONE number only. Never join several numbers with commas. If you cannot tell which challan a vehicle belongs to, leave its challan_no empty.
- If the same vehicle (same chassis or engine number) appears on more than one page, list it only once.
- Leave a field empty ("" or 0) if it is not present or not readable. Never invent a value.`;
    const data=aiProv()==='openai'?await readOpenAI(key,parts,prompt):await readClaude(key,parts,prompt);
    if(!data.vehicles?.length) throw new Error('No vehicle found in this photo. Try again with a clear, straight photo.');
    reviewChallan(data);
  }catch(e){
    openDlg('Could not read the challan',`<p style="margin-top:0">${esc(e.message==='IMG'?'This photo could not be opened. Use a JPG / PNG photo or a PDF (convert iPhone HEIC photos to JPG).':e.message)}</p>`,'<button class="btn" onclick="dlg.close()">OK</button>');
  }
}
async function readOpenAI(key,parts,prompt,schema=CH_SCHEMA,sname='challan'){
  const content=[{type:'text',text:prompt},...parts.map(p=>p.pdf?{type:'file',file:{filename:p.name,file_data:'data:application/pdf;base64,'+p.b64}}
    :{type:'image_url',image_url:{url:'data:image/jpeg;base64,'+p.b64,detail:'high'}})];
  let res;
  try{
    res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+key},
      body:JSON.stringify({model:oaiModel(),max_completion_tokens:16000,messages:[{role:'user',content}],
        response_format:{type:'json_schema',json_schema:{name:sname,strict:true,schema}}})});
  }catch(e){throw new Error('Could not connect to the internet. Check your connection and try again.')}
  const j=await res.json().catch(()=>({})), er=j?.error||{}, em=er.message||'';
  if(!res.ok) throw new Error(res.status===401?'API key is wrong. Enter the correct key in Settings.'
    :er.code==='insufficient_quota'||/quota|billing|credit/i.test(em)?'Your OpenAI API account has no balance. Add balance at platform.openai.com → Billing (ChatGPT Plus does not count here).'
    :er.code==='model_not_found'||/model/i.test(em)&&res.status===404?`Model "${oaiModel()}" was not found in your account. Check the model name in Settings.`
    :[429,500,502,503].includes(res.status)?'The server is busy. Try again in 1–2 minutes.':'Error '+res.status+': '+em);
  const ch=j.choices?.[0]||{}, m=ch.message||{};
  if(m.refusal) throw new Error('This photo could not be read. Try another photo.');
  if(ch.finish_reason==='length') throw new Error('Too many pages. Add the pages in smaller batches.');
  try{return JSON.parse(m.content||'')}catch(e){throw new Error('Could not understand the response. Please try again.')}
}
async function readClaude(key,parts,prompt,schema=CH_SCHEMA){
    const content=[...parts.map(p=>p.pdf?{type:'document',source:{type:'base64',media_type:'application/pdf',data:p.b64}}
      :{type:'image',source:{type:'base64',media_type:'image/jpeg',data:p.b64}}),{type:'text',text:prompt}];
    let res;
    try{
      res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2026-10-21',
        'anthropic-beta':'server-side-fallback-2026-07-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-opus-5-5',max_tokens:16000,fallbacks:'default',output_config:{format:{type:'json_schema',schema}},messages:[{role:'user',content}]})});
    }catch(e){throw new Error('Could not connect to the internet. Check your connection and try again.')}
    const j=await res.json().catch(()=>({})), em=j?.error?.message||'';
    if(!res.ok) throw new Error(res.status===401?'API key is wrong. Enter the correct key in Settings.'
      :/credit|balance|billing/i.test(em)?'Your Anthropic account has no balance. Add balance at console.anthropic.com → Billing.'
      :[429,500,502,503,529].includes(res.status)?'The server is busy. Try again in 1–2 minutes.'
      :/too large|size|exceed/i.test(em)?'File too large. Use fewer pages or smaller photos.':'Error '+res.status+': '+em);
    if(j.stop_reason==='refusal') throw new Error('This photo could not be read. Try another photo.');
    if(j.stop_reason==='max_tokens') throw new Error('Too many pages. Add the pages in smaller batches.');
    try{return JSON.parse((j.content||[]).find(b=>b.type==='text')?.text||'')}catch(e){throw new Error('Could not understand the response. Please try again.')}
}
function reviewChallan(d){
  const sc=new Set(DB.stock.map(s=>s.chassis).filter(Boolean)), se=new Set(DB.stock.map(s=>s.engine).filter(Boolean));
  const bc=new Set(), be=new Set();
  const inp=(n,v,w,extra='')=>`<input name="${n}" value="${esc(v)}" style="min-width:${w}px" ${extra}>`;
  const one=x=>{x=txt(x);return /[,;&]|\band\b|\d\s+\d/i.test(x)?'':x};
  const topD=toISO(d.date)||'', topN=one(d.challan_no);
  let nDup=0, nTwice=0; const anyPer=d.vehicles.some(v=>one(v.challan_no));
  const rows=d.vehicles.map(v=>{const ch=up(v.chassis),en=up(v.engine);
    const dup=(ch&&sc.has(ch))||(en&&se.has(en)), twice=!dup&&((ch&&bc.has(ch))||(en&&be.has(en)));
    if(ch)bc.add(ch); if(en)be.add(en); if(dup)nDup++; if(twice)nTwice++;
    const cn=one(v.challan_no)||(anyPer?'':topN), cd=toISO(v.date)||(anyPer?'':topD);
    return `<tr><td><input type="checkbox" ${dup||twice?'':'checked'} style="width:auto"></td>
    <td>${inp('challan',cn,90,'placeholder="Challan no."'+(cn?'':' style="min-width:90px;border-color:var(--amber)"'))}</td><td><input type="date" name="date" value="${esc(cd)}"></td>
    <td>${inp('model',v.model,150,'list="dlModels"')}</td><td>${inp('colour',v.colour,100,'list="dlCols"')}</td>
    <td>${inp('engine',en,140,'class="mono"')}</td><td>${inp('chassis',ch,180,'class="mono"')}</td><td>${inp('key',up(v.key),70,'class="mono"')}</td><td>${inp('cost',num(v.price)||'',90,'inputmode="decimal"')}</td>
    <td>${dup?'<span class="pill due">Already in stock</span>':twice?'<span class="pill due">Twice in photos</span>':''}</td></tr>`}).join('');
  openDlg(`${d.vehicles.length} vehicles found in challan — check and Save`,`
  ${nDup||nTwice?`<p class="warn" style="margin-top:0">${nDup?`<b>${nDup}</b> already in stock. `:''}${nTwice?`<b>${nTwice}</b> appear twice in the photos. `:''}These are unticked and will not be added again.</p>`:''}
  <div class="row"><label class="grow">Challan no. for rows left blank<input id="chN" value="${esc(topN)}" placeholder="Challan no."></label>
    <label class="grow">Date for rows left blank<input type="date" id="chD" value="${esc(topD||today())}"></label></div>
  ${d.supplier?`<p class="note">Supplier: ${esc(d.supplier)}</p>`:''}
  <div class="tablewrap imp" style="margin-top:10px"><table id="chT"><tr><th></th><th>Challan</th><th>Date</th><th>Model</th><th>Colour</th><th>Engine No</th><th>Chassis No</th><th>Key</th><th>Price</th><th></th></tr>
  ${rows}</table></div>
  ${dl('dlModels',DB.settings.models)}${dl('dlCols',DB.settings.colours)}
  <p class="note">⚠ Check the numbers read by AI against the challan — especially Engine and Chassis No. Challan no. and date can be changed per vehicle (or left blank and filled later). Untick any vehicle you do not want to add.</p>`,
  `<button class="btn plain" onclick="dlg.close()">Cancel</button><button class="btn" onclick="saveChallan()">Save to stock</button>`);
  dlg.style.maxWidth='1100px'; dlg.addEventListener('close',()=>dlg.style.maxWidth='',{once:true});
}
function saveChallan(){
  const defD=$('#chD').value||today(), defN=txt($('#chN').value), out=[], bad=[], skipped=[];
  const sc=new Set(DB.stock.map(s=>s.chassis).filter(Boolean)), se=new Set(DB.stock.map(s=>s.engine).filter(Boolean));
  [...document.querySelectorAll('#chT tr')].slice(1).forEach((tr,i)=>{
    if(!tr.querySelector('input[type=checkbox]').checked) return;
    const g=n=>txt(tr.querySelector(`[name=${n}]`).value);
    const s={date:g('date')||defD,challan:g('challan')||defN,model:g('model'),colour:g('colour'),engine:up(g('engine')),chassis:up(g('chassis')),key:up(g('key')),cost:g('cost')?String(num(g('cost'))):''};
    if(!s.model||!(s.chassis||s.engine)){bad.push(i+1);return}
    if((s.chassis&&sc.has(s.chassis))||(s.engine&&se.has(s.engine))){skipped.push(s.chassis||s.engine);return}
    if(s.chassis)sc.add(s.chassis); if(s.engine)se.add(s.engine); out.push(s);
  });
  if(bad.length){alert(`Line ${bad.join(', ')}: Model or Chassis/Engine No is empty. Fill it in or untick it.`);return}
  if(!out.length){alert(skipped.length?`All selected vehicles (${skipped.length}) are already in stock — nothing added.`:'No vehicle selected.');return}
  const t0=Date.now();
  out.forEach((s,i)=>{DB.stock.push({id:uid(),created:t0+i,status:'in',...s});
    if(s.model&&!DB.settings.models.includes(s.model))DB.settings.models.push(s.model);
    if(s.colour&&!DB.settings.colours.includes(s.colour))DB.settings.colours.push(s.colour)});
  save(); dlg.close(); toast(`${out.length} vehicles added to stock`+(skipped.length?` · ${skipped.length} already existed, skipped`:'')); go('stock');
}

const SHOP='chhachhrauli', FBV='12.19.0', CPK=KEY+'_cloudproj', PRE=KEY+'_precloud';
const COLS=['stock','sales','daybook','enquiries','partners','capital','dealerPay','expPay','expenses','oldveh'];
const jparse=j=>{try{return JSON.parse(j)}catch(e){return null}};
const localHas=()=>COLS.some(c=>(DB[c]||[]).length);
function cacheLocal(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function cloudScreen(html){$('#nav').innerHTML='';$('#app').innerHTML=`<div class="card" style="max-width:460px;margin:40px auto">${html}</div>`}
function syncLabel(){

async function cloudInit(){
  cloudScreen('<div class="empty">⏳ Connecting to cloud…</div>');
  const b=window.__FBBASE||`https://www.gstatic.com/firebasejs/${FBV}/`;
  try{
    const [A,U,F]=await Promise.all(['app','auth','firestore'].map(m=>import(b+'firebase-'+m+'.js')));
    const app=A.initializeApp(fbCfg()), auth=U.getAuth(app);
    let db; try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){db=F.getFirestore(app)}
    FB={A,U,F,app,auth,db};
  }catch(e){
    cloudScreen(`<h2>No internet</h2><p style="margin-top:0">Internet is needed to connect to the cloud.</p><div class="row"><button class="btn" onclick="location.reload()">Try again</button>${localHas()?'<button class="btn plain" onclick="READONLY=true;setSync();render()">View saved data (read only)</button>':''}</div>`);

function showLogin(msg=''){

function authMsg(er){const c=(er&&er.code)||'';return /invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c)?'Wrong email or password.':/too-many/.test(c)?'Too many failed attempts. Try again later.':/network/.test(c)?'No internet.':'Login failed ('+(c||er)+')'}

function cloudStart(){
  cloudScreen('<div class="empty">⏳ Loading data…</div>');
  const slow=setTimeout(()=>{if(!cloudReady&&!READONLY)cloudScreen('<div class="empty">⏳ Loading data… the internet seems slow.<br><br><button class="btn plain" onclick="location.reload()">Try again</button></div>')},20000);
  const {F,db}=FB, init={}, need=COLS.length+1; let started=false;
  const begin=()=>{if(started||Object.keys(init).length<need)return; started=true; clearTimeout(slow); cloudFirst(init)};
  COLS.forEach(c=>UNSUB.push(F.onSnapshot(F.collection(db,'shops',SHOP,c),{includeMetadataChanges:true},snap=>{
    if(!cloudReady){ if(started) return; if(snap.metadata.fromCache&&snap.empty) return; init[c]=snap.docs.map(d=>d.data().j); begin(); return }
    remoteCol(c,snap);
  },cloudErr)));
  UNSUB.push(F.onSnapshot(F.collection(db,'shops',SHOP,'finentries'),snap=>{
    FINQ=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(cloudReady){ if(finApply()) save(); remoteChanged() }
  },()=>{}));
  UNSUB.push(F.onSnapshot(F.doc(db,'shops',SHOP,'meta','settings'),{includeMetadataChanges:true},snap=>{
    if(!cloudReady){ if(started) return; if(snap.metadata.fromCache&&!snap.exists()) return; init._s=snap.exists()?snap.data().j:null; begin(); return }
    if(snap.exists()) remoteSettings(snap.data().j);
  },cloudErr));
}
function cloudFirst(init){
  const pid=fbCfg().projectId, wasCache=localStorage.getItem(CPK)===pid;
  const cloudEmpty=COLS.every(c=>!init[c].length)&&!init._s;
  const cdb={settings:(init._s&&jparse(init._s))||structuredClone(DB.settings)};
  COLS.forEach(c=>cdb[c]=init[c].map(jparse).filter(Boolean));
  const syncedFromInit=()=>{SYNCED={};COLS.forEach(c=>{SYNCED[c]=new Map(init[c].map(j=>{const r=jparse(j);return r&&[r.id,j]}).filter(Boolean))});SYNCED._s=init._s||undefined};
  window.__cloudFinish=(choice)=>{
    if(choice==='upload'){ syncedFromInit(); }                                   // keep local DB, push all
    else if(choice==='fresh'){ try{localStorage.setItem(PRE,JSON.stringify(DB))}catch(e){} DB={...structuredClone(DEFAULTS),settings:DB.settings}; syncedFromInit(); }
    else { if(localHas()&&!wasCache){try{localStorage.setItem(PRE,JSON.stringify(DB))}catch(e){}} DB=cdb; syncedFromInit(); }
    for(const k in DEFAULTS) if(!(k in DB)) DB[k]=structuredClone(DEFAULTS[k]);
    try{localStorage.setItem(CPK,pid)}catch(e){}
    cloudReady=true; cacheLocal(); cloudPush(); setSync('ok'); render();
    if(choice==='cloud'&&localStorage.getItem(PRE)&&!wasCache&&localHas0) toast('This device’s old data has been kept aside (see Settings)');
  };
  const localHas0=localHas();

    for(const id of [...m.keys()]) if(!seen.has(id)){m.delete(id);ops.push([c,id,null])}

function finApply(){

    if((e.m||'')!==lbl){ e.m=lbl; FB.F.updateDoc(finRef(e.id),{m:lbl}).catch(()=>{}) }

    if(txt(e.financer)) s.financer=txt(e.financer);

      if(!de){ de={id:'fin_'+s.id,created:Date.now(),type:'in',saleId:s.id,fin:true,mode:'Bank'}; DB.daybook.push(de) }

      DB.daybook=DB.daybook.filter(x=>!(x.fin&&x.saleId===s.id));
    }

    s.payments=s.payments||[]; const pid='dp_'+s.id, dp=num(e.down);
    let p=s.payments.find(x=>x.id===pid);
    const others=s.payments.filter(x=>x.id!==pid).reduce((t,x)=>t+num(x.amount),0);
    if(dp>0&&!p&&Math.round(others)!==Math.round(dp)){ p={id:pid,mode:'Cash'}; s.payments.push(p) }
    if(p&&dp>0){
      Object.assign(p,{date:e.date||s.date,amount:dp});
      let pe=DB.daybook.find(x=>x.payId===pid);
      if(!pe){ pe={id:'dpd_'+s.id,created:Date.now(),type:'in',saleId:s.id,payId:pid}; DB.daybook.push(pe) }
      Object.assign(pe,{date:p.date,amount:dp,mode:p.mode||'Cash',particulars:`Sale #${s.inv} – ${s.name} (${s.model}) · down payment`}); if(p.by) pe.by=p.by; else delete pe.by;
    } else if(p&&dp<=0){ s.payments=s.payments.filter(x=>x.id!==pid); DB.daybook=DB.daybook.filter(x=>x.payId!==pid) }
    // old vehicle taken in exchange
    if(txt(e.exReg)||txt(e.exModel)||num(e.exValue)){
      if(txt(e.exReg)) s.exchangeReg=up(e.exReg); if(txt(e.exModel)) s.exchange=txt(e.exModel); s.exchangeValue=num(e.exValue);

  }

}

  if(!ex) rec.challan=txt(d.challan).toUpperCase();
  if(d.financer) rec.financer=txt(d.financer);
  FB.F.setDoc(finRef(id),rec,{merge:true}).catch(e=>toast('⚠ Not saved: '+(e.code||e.message)));
  toast(navigator.onLine?'Saved ✓':'Saved – will sync when online'); staffView();
}
function staffHint(){const f=$('#sform'), k=chKey(f.challan.value), e=k&&FINQ.find(x=>x.id==='c_'+k&&x.id!==f.eid.value);
  $('#shint').innerHTML=e&&e.name?`⚠ Sale challan ${esc(e.challan)} is already entered (${esc(e.name)}). <a href="#" onclick="staffEdit('${e.id}');return false">Open it to change</a> — do not enter it twice.`
    :e?`Finance for challan ${esc(e.challan)} is already entered — the sale details will be added to it.`:''}
function staffList(){
  const q=String(staffQ).trim().toLowerCase(), qk=chKey(q);
  const L=FINQ.filter(e=>!q||(qk&&chKey(e.challan).includes(qk))||String(e.name||'').toLowerCase().includes(q)).sort((a,b)=>(b.at?.seconds||9e12)-(a.at?.seconds||9e12));
  const pend=e=>e._p?' <span class="muted">⏳</span>':'';
  if(!L.length){$('#slist').innerHTML='<div class="empty">No entries yet.</div>';return}
  $('#slist').innerHTML=staffTab==='fin'
    ?`<div class="tablewrap"><table><tr><th>Sale Challan</th><th>Customer</th><th>Financed</th><th>Received</th><th></th></tr>${L.map(e=>`<tr>
      <td><b>${esc(e.challan)}</b></td><td>${esc(e.name||'')}<div class="sub2">${esc(e.financer||'')}</div></td><td>${num(e.amount)?rs(e.amount):'—'}</td>
      <td>${e.recd?`<span class="pill in">${rs(e.recdAmt)}</span> ${fd(e.recdDate)}${Math.abs(num(e.recdAmt)-num(e.amount))>=0.5&&num(e.amount)?`<div class="sub2">${num(e.recdAmt)<num(e.amount)?rs(num(e.amount)-num(e.recdAmt))+' short':rs(num(e.recdAmt)-num(e.amount))+' excess'}</div>`:''}`:num(e.amount)?'<span class="pill due">pending</span>':''}${pend(e)}</td>
      <td><button class="btn plain sm" onclick="staffEdit('${e.id}')">Edit</button></td></tr>`).join('')}</table></div>`
    :`<div class="tablewrap"><table><tr><th>Sale Challan</th><th>Customer</th><th>Down pay</th><th>Finance</th><th>Old vehicle</th><th>Office</th><th></th></tr>${L.filter(e=>e.name).map(e=>`<tr>
      <td><b>${esc(e.challan)}</b><div class="sub2">${fd(e.date)}</div></td><td>${esc(e.name)}<div class="sub2">${esc(e.model||'')}</div></td><td>${rs(e.down)}</td>
      <td>${rs(e.amount)}<br>${num(e.amount)?(e.recd?`<span class="pill in">Recd ${rs(e.recdAmt)}</span>`:'<span class="pill due">pending</span>'):''}${pend(e)}</td>
      <td>${txt(e.exReg)||txt(e.exModel)?`${esc(e.exReg)}<div class="sub2">${esc(e.exModel)} · ${rs(e.exValue)}</div>`:'—'}</td>
      <td style="white-space:normal">${e.m?esc(e.m):'<span class="muted">waiting</span>'}</td>
      <td><button class="btn plain sm" onclick="staffEdit('${e.id}')">Edit</button></td></tr>`).join('')}</table></div>`;
}
function staffEdit(id){
  const e=FINQ.find(x=>x.id===id); if(!e) return;
  if(staffTab==='fin'){ const f=$('#fform'); f.challan.value=e.challan; f.challan.readOnly=true; staffFinLoad();
    $('#shint').innerHTML+=` <a href="#" style="color:var(--red)" onclick="staffDel('${id}');return false">Delete this entry</a>`; scrollTo({top:0,behavior:'smooth'}); return }
  const f=$('#sform'); f.eid.value=id;
  ['challan','date','pchallan','name','phone','model','chassis','down','amount','financer','exReg','exModel','exValue'].forEach(k=>{f[k].value=['down','amount','exValue'].includes(k)?(num(e[k])||''):(e[k]??'')});
  f.challan.readOnly=true;
  $('#shint').innerHTML=`Changing sale challan <b>${esc(e.challan)}</b>. <a href="#" style="color:var(--red)" onclick="staffDel('${id}');return false">Delete this entry</a>`;
  scrollTo({top:0,behavior:'smooth'});
}
function staffDel(id){
  if(!confirm('Delete this entry?')) return;
  FB.F.deleteDoc(finRef(id)).catch(e=>toast('⚠ '+(e.code||e.message))); staffView(); toast('Deleted');
}
function staffSave(ev){
  ev.preventDefault(); const f=ev.target, d=formData(f), k=chKey(d.challan);
  if(!k){alert('Enter the Sale Challan No.');return}
  if(!d.name){alert('Enter the customer name.');return}
  if(d.date>today()){alert('Sale date cannot be in the future.');return}
  const id='c_'+k, ex=FINQ.find(x=>x.id===id);
  if(ex&&ex.name&&d.eid!==id){ alert(`Sale challan ${ex.challan} is already entered (${ex.name}). It will open now — change it there instead of entering it twice.`); staffEdit(id); return }
  const chs=up(d.chassis), dc=chs&&FINQ.find(x=>x.id!==id&&up(x.chassis)===chs);
  if(dc&&!confirm(`⚠ Possible DOUBLE ENTRY\n\nChassis ${chs} is already entered with sale challan ${dc.challan} (${dc.name}).\n\nSave anyway?`)) return;
  const exr=up(d.exReg), dx=exr&&FINQ.find(x=>x.id!==id&&up(x.exReg)===exr);
  if(dx&&!confirm(`⚠ Possible DOUBLE ENTRY\n\nOld vehicle ${exr} is already entered with sale challan ${dx.challan} (${dx.name}).\n\nSave anyway?`)) return;
  if((exr||d.exModel)&&num(d.exValue)<=0&&!confirm('Old vehicle value is empty. Save anyway?')) return;
  const rec={challan:ex?ex.challan:txt(d.challan).toUpperCase(),date:d.date,pchallan:txt(d.pchallan).toUpperCase(),name:txt(d.name),phone:txt(d.phone),model:txt(d.model),chassis:chs,
    down:num(d.down),amount:num(d.amount),financer:txt(d.financer),exReg:exr,exModel:txt(d.exModel),exValue:num(d.exValue),by:cloudEmail,at:FB.F.serverTimestamp()};
  if(!ex) Object.assign(rec,{recd:false,recdAmt:0,recdDate:''});
  FB.F.setDoc(finRef(id),rec,{merge:true}).catch(e=>toast('⚠ Not saved: '+(e.code||e.message)));
  toast(navigator.onLine?'Saved ✓':'Saved – will sync when online'); staffView();
}

$('#app').addEventListener('input',()=>{appDirty=true});
dlg.addEventListener('close',()=>{if(cloudReady&&!$('#syncbar').classList.contains('hide')&&!appDirty)render()});

if(CLOUD) cloudInit(); else render();
</script>
</body>
</html>
